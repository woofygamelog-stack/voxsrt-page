name: VoxSRT privacy question
description: Ask a non-sensitive question about VoxSRT privacy behavior in a public issue.
title: "[Privacy] "
labels: []
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        GitHub Issues are public. Do not post personal data, media, audio, subtitle content, credentials, personal file names, full file paths, or diagnostics. If a question cannot be asked safely in public, do not submit it here.
  - type: dropdown
    id: topic
    attributes:
      label: Topic
      options:
        - Local processing and storage
        - Model downloads
        - Diagnostics
        - Store licensing
        - Data removal
        - Other privacy question
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: Question
      description: Ask using non-sensitive details only.
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Public-data confirmation
      options:
        - label: I confirm this public issue contains no personal data, media, subtitle content, credentials, file names, full paths, or diagnostics.
          required: true
